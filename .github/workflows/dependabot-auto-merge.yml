name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false

    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN must be configured as a Dependabot secret so Dependabot merges can trigger release workflows."
            exit 1
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI and merge minor or patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event pull_request --commit "$PR_HEAD_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status
              gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::No CI run found for the captured PR head."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
