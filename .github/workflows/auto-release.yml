name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto-release on dependency update
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       startsWith(github.event.workflow_run.head_commit.message, 'build(deps') ||
       startsWith(github.event.workflow_run.head_commit.message, 'chore(deps'))

    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is required to push version tags and trigger publishing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release the tested dependency update
        run: |
          branch_sha=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          if [ "$branch_sha" != "$TESTED_SHA" ]; then
            echo "Branch has advanced; skipping this stale CI run."
            exit 0
          fi
          if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(package.json|pnpm-lock.yaml)$'; then
            echo "No library dependency metadata changed; skipping release."
            exit 0
          fi
          npm version patch --no-git-tag-version --ignore-scripts
          VERSION="v$(node -p "require('./package.json').version")"
          git add package.json
          git commit -m "chore(release): $VERSION"
          git tag "$VERSION"
          git push --atomic origin "HEAD:$RELEASE_BRANCH" "$VERSION"
          gh release create "$VERSION" \
            --verify-tag --title "$VERSION" \
            --notes "Automated release for dependency updates." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
